<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Pro Saver & Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 31, 48, 0.7);
            --accent: #ff0050;
            --accent-cyan: #00f2fe;
            --accent-green: #00e676;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 0, 80, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-weight: 800;
            font-size: 26px;
            background: linear-gradient(45deg, var(--accent), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 13px;
            margin-top: 6px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 18px;
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(45deg, var(--accent), #ff2a75);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 25px rgba(255, 0, 80, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 0, 80, 0.6);
        }

        /* Result Section */
        .result-card {
            display: none;
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border);
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        .result-card img {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 15px;
            color: #e2e8f0;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00c853, var(--accent-green));
            color: #000;
            font-weight: 800;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 230, 118, 0.3);
            transition: 0.2s;
        }

        .download-btn:hover {
            transform: scale(1.02);
        }

        /* Console Section */
        .console-container {
            margin-top: 25px;
            background: #050811;
            border-radius: 14px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            overflow: hidden;
        }

        .console-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            font-size: 11px;
            font-family: 'Fira Code', monospace;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .console-body {
            padding: 12px;
            height: 110px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-dim);
            display: flex;
            flex-direction: column;
        }

        .log-item { margin-bottom: 4px; }
        .log-info { color: var(--accent-cyan); }
        .log-success { color: var(--accent-green); }
        .log-error { color: var(--accent); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>TikTok Pro Saver</h1>
        <p>Watermark-sız HD video yükləmə paneli</p>
    </div>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="TikTok video keçidini yapışdırın...">
    </div>

    <button class="btn-submit" onclick="startProcess()">Videonu Getir</button>

    <div class="result-card" id="resultCard">
        <img id="coverImg" src="" alt="Cover">
        <div class="video-title" id="videoTitle"></div>
        <a href="" id="downloadBtn" target="_blank" class="download-btn">VİDEONU ENDİR (NO WATERMARK)</a>
    </div>

    <!-- Live Console -->
    <div class="console-container">
        <div class="console-header">
            <span>● REAL-TIME CONSOLE LOG</span>
            <span id="statusDot" style="color: #666;">● System Idle</span>
        </div>
        <div class="console-body" id="consoleBody">
            <div class="log-item">[SYS] Sistem hazırdır. Link gözlənilir...</div>
        </div>
    </div>
</div>

<script>
    function log(msg, type = 'info') {
        const consoleBody = document.getElementById('consoleBody');
        const time = new Date().toLocaleTimeString();
        let colorClass = 'log-info';

        if (type === 'success') colorClass = 'log-success';
        if (type === 'error') colorClass = 'log-error';

        const item = document.createElement('div');
        item.className = `log-item ${colorClass}`;
        item.innerText = `[${time}] ${msg}`;
        
        consoleBody.appendChild(item);
        consoleBody.scrollTop = consoleBody.scrollHeight;
    }

    async function startProcess() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const resultCard = document.getElementById('resultCard');
        const statusDot = document.getElementById('statusDot');

        resultCard.style.display = 'none';

        if (!urlInput) {
            log("XƏTA: Link sahəsi boş buraxıla bilməz!", "error");
            return;
        }

        statusDot.style.color = "#00f2fe";
        statusDot.innerText = "● Processing";

        log("Sorğu başladıldı...", "info");
        log(`Daxil edilən URL: ${urlInput.substring(0, 30)}...`, "info");

        try {
            log("Backend API-yə bağlantı qurulur...", "info");
            
            const res = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            log("API cavabı alındı, məlumatlar emal edilir...", "info");
            const data = await res.json();

            if (data.success) {
                log("MÜVƏFFƏQİYYƏT: Video məlumatları alındı!", "success");
                log(`Müəllif: ${data.author}`, "success");

                document.getElementById('coverImg').src = data.cover;
                document.getElementById('videoTitle').innerText = data.title;
                document.getElementById('downloadBtn').href = data.downloadUrl;

                resultCard.style.display = 'block';
                statusDot.style.color = "#00e676";
                statusDot.innerText = "● Ready";
            } else {
                log(`XƏTA: ${data.message}`, "error");
                statusDot.style.color = "#ff0050";
                statusDot.innerText = "● Error";
            }
        } catch (err) {
            log("KRİTİK XƏTA: Serverlə əlaqə kəsildi və ya CORS xətası!", "error");
            statusDot.style.color = "#ff0050";
            statusDot.innerText = "● Connection Failed";
        }
    }
</script>

</body>
</html>
